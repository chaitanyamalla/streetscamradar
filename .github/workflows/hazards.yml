# ---------------------------------------------------------------------------
# Ongoing natural disasters, from GDACS, into public.disaster_alerts.
#
# Mirrored rather than fetched by the page. GDACS sends no cache headers, so a
# direct fetch would mean every visitor's session hitting a service run for
# emergency response; this asks once every few hours however many people are
# looking, and keeps showing a disaster when GDACS is having a bad day.
#
# Severe weather comes from MeteoAlarm, the European met services' shared
# warning system, in the same way and for the same reason — one request per
# country, no CORS, and nothing of ours added to what they issued.
#
# NOAA's National Weather Service was here too, briefly, and was removed. Its
# feed is mostly marine advisories and county flood warnings, and on a world
# travel map the result was a United States covered in flood signs that looked
# exactly like GDACS disasters and linked to a weather.gov home page. More
# noise than information. MeteoAlarm stays because its grading — orange and red
# only — is already the filter a traveller needs.
#
# Earthquakes are NOT here. USGS serves its feeds with permissive CORS and a
# 60-second cache, built to be read from a page, and an earthquake's position
# matters — so those are fetched in the browser and drawn where they happened.
#
# Neither source can fail the other, and neither can fail the run on its own.
# GDACS timing out used to stop the job before MeteoAlarm was even asked, so one
# service having a bad afternoon took down the half that was working. Each half
# now runs and loads independently, and whether the run is RED is decided at the
# end from the only thing that matters to a reader: how old the newest row is.
# A fetch that fails while the table was loaded an hour ago is a blip the next
# run heals, and is reported and forgiven. A table that has gone STALE_MINUTES
# without a successful load is a real outage and fails the run. A load step
# failing is ours, not the source's, and always fails the run.
#
# Needs the same SUPABASE_DB_URL secret as the other database workflows.
# ---------------------------------------------------------------------------
name: Refresh hazards

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Only look at the sources and report what they send. Writes nothing.'
        required: false
        default: false
        type: boolean
  schedule:
    # Every three hours. A flood or a cyclone is a thing that lasts days, so
    # this is about being roughly current rather than live; the page shows the
    # event's own dates so a reader can see for themselves.
    - cron: '41 */3 * * *'

concurrency:
  group: hazards
  cancel-in-progress: false

jobs:
  hazards:
    runs-on: ubuntu-latest
    # A source that stops answering must not hold a runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Before changing a parser, look at what the source actually sends. The
      # travel advisory work shipped one built from a published schema the live
      # interface did not match, and the first real run rejected every entry.
      - name: Look at the sources
        if: ${{ inputs.probe }}
        run: python3 supabase/ops/probe_hazards.py

      - name: Check the secret is set
        if: ${{ !inputs.probe }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL is not set."
            exit 1
          fi

      - name: Install psql
        if: ${{ !inputs.probe }}
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      - name: Resolve a reachable host
        if: ${{ !inputs.probe }}
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY' > resolved.env
          import os, sys, urllib.parse, subprocess
          u = os.environ["PGURL"].strip().strip('"').strip("'")
          p = urllib.parse.urlparse(u)
          host, pwd = p.hostname or "", p.password or ""
          print(f"::add-mask::{pwd}", file=sys.stderr)

          if "pooler.supabase.com" in host or not host.startswith("db."):
              print(f"PGURL_FINAL={u}")
              sys.exit(0)

          ref = host[len("db."):-len(".supabase.co")]
          regions = ["eu-central-1","eu-west-1","eu-west-2","eu-west-3","eu-north-1","eu-central-2",
                     "ap-south-1","ap-southeast-1","ap-southeast-2","ap-northeast-1","ap-northeast-2",
                     "us-east-1","us-east-2","us-west-1","us-west-2","ca-central-1","sa-east-1"]
          quoted = urllib.parse.quote(pwd, safe="")
          env = {**os.environ, "PGCONNECT_TIMEOUT": "6"}
          for prefix in ("aws-0", "aws-1"):
              for r in regions:
                  ph = f"{prefix}-{r}.pooler.supabase.com"
                  cand = f"postgresql://postgres.{ref}:{quoted}@{ph}:5432/postgres"
                  if subprocess.run(["psql", cand, "-tAc", "select 1"],
                                    capture_output=True, text=True, env=env).returncode == 0:
                      print(f"Connected via {ph}", file=sys.stderr)
                      print(f"PGURL_FINAL={cand}")
                      sys.exit(0)
          print("::error::Could not reach any pooler host.", file=sys.stderr)
          sys.exit(1)
          PY
          cat resolved.env >> "$GITHUB_ENV"
          rm -f resolved.env

      # The only thing that writes to disaster_alerts, running unattended. The
      # case worth guarding is GDACS answering badly, which taken literally
      # means nothing is happening anywhere on Earth.
      - name: Check the generators
        if: ${{ !inputs.probe }}
        run: |
          python3 supabase/ops/fetch_disasters_test.py
          python3 supabase/ops/fetch_weather_test.py
          python3 supabase/ops/resolve_weather_places_test.py

      # continue-on-error, and the verdict step at the end decides. GDACS is the
      # flakier of the two by a wide margin: six timed-out attempts across both
      # its endpoints is a normal bad afternoon there, and it must not cost us
      # Europe's weather warnings.
      #
      # timeout-minutes because the retries inside the script are patient and
      # the job's own budget is fifteen minutes for both sources.
      - name: Fetch from GDACS
        id: gdacs_fetch
        if: ${{ !inputs.probe }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python3 supabase/ops/fetch_disasters.py > disasters.sql
          head -1 disasters.sql

      # Only if there is something to load. A failed fetch leaves disasters.sql
      # truncated, and psql would happily apply an empty file.
      - name: Load the disasters into Supabase
        id: gdacs_load
        if: ${{ !inputs.probe && steps.gdacs_fetch.outcome == 'success' }}
        continue-on-error: true
        env:
          PGURL: ${{ env.PGURL_FINAL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f disasters.sql

      # Europe's national met services, through MeteoAlarm. One request per
      # country because that is how it publishes; it is the slow step here.
      #
      # After the disasters in running order and independent of them in every
      # other sense: whichever of the two answered gets loaded.
      - name: Fetch from MeteoAlarm
        id: weather_fetch
        if: ${{ !inputs.probe }}
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python3 supabase/ops/fetch_weather.py > weather.sql
          head -1 weather.sql

      - name: Load the weather warnings into Supabase
        id: weather_load
        if: ${{ !inputs.probe && steps.weather_fetch.outcome == 'success' }}
        continue-on-error: true
        env:
          PGURL: ${{ env.PGURL_FINAL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f weather.sql

      # Thirty of MeteoAlarm's thirty-eight services send no geometry, so their
      # warnings are drawn on the middle of their country. A country is looked up
      # ONCE and then never again — thirty-eight in total, ever — so this asks
      # the geocoder nothing at all on an ordinary run.
      - name: Find countries we have not placed yet
        if: ${{ !inputs.probe }}
        continue-on-error: true
        env:
          PGURL: ${{ env.PGURL_FINAL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -tA -c "
            select distinct w.country_code
              from public.weather_warnings w
              left join public.weather_places p on p.country_code = w.country_code
             where w.lat is null and p.country_code is null
             order by 1" > todo.txt
          echo "countries to look up: $(wc -l < todo.txt)"

      # Nominatim, one request a second as its terms ask. A geocoder having a bad
      # afternoon must not fail the refresh: the warnings are already loaded and
      # already in the chip by this point, and a missing marker is a smaller
      # thing than a red workflow.
      - name: Look up the new countries
        if: ${{ !inputs.probe }}
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python3 supabase/ops/resolve_weather_places.py todo.txt > places.sql
          head -1 places.sql

      - name: Place the warnings on their countries
        if: ${{ !inputs.probe }}
        continue-on-error: true
        env:
          PGURL: ${{ env.PGURL_FINAL }}
        run: |
          test -s places.sql && psql "$PGURL" -v ON_ERROR_STOP=1 -f places.sql

      # ---------------------------------------------------------------------
      # Is this run a failure?
      #
      # Everything above is forgiving, so this is the one step that can turn
      # the run red, and it answers the reader's question rather than the
      # runner's: is what the map is showing still current?
      #
      #   A load step failed      -> red. That is our SQL or our database, and
      #                              no amount of waiting fixes it.
      #   A fetch failed, table   -> green, with a note. GDACS times out, the
      #   loaded recently            next run three hours later heals it, and
      #                              an email about it teaches us to ignore
      #                              emails about it.
      #   A fetch failed, table   -> red. Four scheduled runs in a row have
      #   stale or never loaded      failed to get through; that is an outage
      #                              and the map is quietly going out of date.
      #
      # STALE_MINUTES is 720 — twelve hours, four misses of the three-hourly
      # schedule. Tightening it to one miss would restore exactly the alert
      # this step exists to stop sending.
      # ---------------------------------------------------------------------
      - name: Decide whether this run failed
        if: ${{ always() && !inputs.probe && env.PGURL_FINAL != '' }}
        env:
          PGURL: ${{ env.PGURL_FINAL }}
          STALE_MINUTES: '720'
          GDACS_FETCH: ${{ steps.gdacs_fetch.outcome }}
          GDACS_LOAD: ${{ steps.gdacs_load.outcome }}
          WEATHER_FETCH: ${{ steps.weather_fetch.outcome }}
          WEATHER_LOAD: ${{ steps.weather_load.outcome }}
        run: |
          set -u
          red=0

          # 999999 for an empty table: never loaded is the stalest there is.
          age() {
            psql "$PGURL" -tAc "select coalesce(
              (extract(epoch from (now() - max(refreshed_at))) / 60)::bigint,
              999999) from public.$1"
          }

          judge() {
            name="$1"; table="$2"; fetch="$3"; load="$4"
            if [ "$load" = failure ]; then
              echo "::error::Loading $name into Supabase failed. That is ours, not theirs."
              red=1
              return
            fi
            minutes="$(age "$table")"
            case "$minutes" in
              ''|*[!0-9]*)
                echo "::error::Could not read how old public.$table is."
                red=1
                return
                ;;
            esac
            if [ "$minutes" -ge 999999 ]; then
              when="never"
            else
              when="$(( minutes / 60 ))h ago"
            fi
            if [ "$fetch" = success ]; then
              echo "$name: loaded, newest row ${minutes}m old."
            elif [ "$minutes" -gt "$STALE_MINUTES" ]; then
              echo "::error::$name could not be fetched and public.$table was loaded"
              echo "::error::${when}. The map is going out of date."
              red=1
            else
              echo "::warning::$name could not be fetched this run. public.$table was"
              echo "::warning::loaded ${when} and still stands; the next run will heal it."
            fi
          }

          judge GDACS      disaster_alerts  "$GDACS_FETCH"   "$GDACS_LOAD"
          judge MeteoAlarm weather_warnings "$WEATHER_FETCH" "$WEATHER_LOAD"

          exit "$red"
