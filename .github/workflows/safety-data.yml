# ---------------------------------------------------------------------------
# Refresh public.safety_places from OpenStreetMap.
#
# The site used to query Overpass live on every pan, which made a core feature
# only as reliable as a free, congested, shared service. This job does that
# work here instead — where slow is fine — and the page just reads our own
# table. Police stations and hospitals barely move, so running this
# occasionally is plenty.
#
# Areas are derived from where reports actually are, so the data follows the
# map rather than a hardcoded city list.
#
# Needs the same SUPABASE_DB_URL secret as the database workflow.
# ---------------------------------------------------------------------------
name: Refresh safety places

on:
  workflow_dispatch:
    inputs:
      extra_areas:
        description: 'Optional extra areas: "lat,lng" or "City,cc,lat,lng", semicolon separated'
        required: false
        default: ''
        type: string
      countries:
        description: 'Optional whole countries by ISO code, e.g. "DE" or "DE,AT,CH"'
        required: false
        default: ''
        type: string
      city_list:
        description: 'Optional file of cities under supabase/ops/, e.g. cities_europe.txt'
        required: false
        default: ''
        type: string
      prune:
        description: 'Delete places this run did not find. ONLY for a run that covers everything.'
        required: false
        default: false
        type: boolean
  schedule:
    # Monthly, on the 1st. Police stations and hospitals do not move, and a
    # nightly run spent almost all of its time re-confirming what it confirmed
    # the night before — while leaning on Overpass, a free volunteer service,
    # for no gain. The reason it was ever daily was to cover a newly reported
    # city quickly; Europe's tourist cities are now covered up front by
    # cities_europe.txt instead, which is the better answer to that problem.
    - cron: '17 4 1 * *'

concurrency:
  group: safety-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL is not set."
            exit 1
          fi

      - name: Install psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      # The direct db.<ref>.supabase.co host is IPv6-only and runners are
      # IPv4-only, so reuse the same pooler discovery as the database workflow.
      - name: Resolve a reachable host
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY' > resolved.env
          import os, sys, urllib.parse, subprocess
          u = os.environ["PGURL"].strip().strip('"').strip("'")
          p = urllib.parse.urlparse(u)
          host, pwd = p.hostname or "", p.password or ""
          print(f"::add-mask::{pwd}", file=sys.stderr)

          if "pooler.supabase.com" in host or not host.startswith("db."):
              print(f"PGURL_FINAL={u}")
              sys.exit(0)

          ref = host[len("db."):-len(".supabase.co")]
          regions = ["eu-central-1","eu-west-1","eu-west-2","eu-west-3","eu-north-1","eu-central-2",
                     "ap-south-1","ap-southeast-1","ap-southeast-2","ap-northeast-1","ap-northeast-2",
                     "us-east-1","us-east-2","us-west-1","us-west-2","ca-central-1","sa-east-1"]
          quoted = urllib.parse.quote(pwd, safe="")
          env = {**os.environ, "PGCONNECT_TIMEOUT": "6"}
          for prefix in ("aws-0", "aws-1"):
              for r in regions:
                  ph = f"{prefix}-{r}.pooler.supabase.com"
                  cand = f"postgresql://postgres.{ref}:{quoted}@{ph}:5432/postgres"
                  if subprocess.run(["psql", cand, "-tAc", "select 1"],
                                    capture_output=True, text=True, env=env).returncode == 0:
                      print(f"Connected via {ph}", file=sys.stderr)
                      print(f"PGURL_FINAL={cand}")
                      sys.exit(0)
          print("::error::Could not reach any pooler host.", file=sys.stderr)
          sys.exit(1)
          PY
          cat resolved.env >> "$GITHUB_ENV"
          rm -f resolved.env

      # One row per city that has reports. Coordinates are the average of its
      # reports and are only used to sanity-check the city lookup, or as a
      # fallback centre when the name cannot be resolved — they are no longer
      # the search centre, which is what made coverage a small offset disc.
      - name: Work out which areas need data
        env:
          PGURL: ${{ env.PGURL_FINAL }}
          EXTRA: ${{ inputs.extra_areas }}
          COUNTRIES: ${{ inputs.countries }}
          CITY_LIST: ${{ inputs.city_list }}
        run: |
          : > areas.csv
          # A curated list of cities, covered whether or not anybody has
          # reported a scam there yet.
          if [ -n "$CITY_LIST" ]; then
            if [ ! -f "supabase/ops/$CITY_LIST" ]; then
              echo "::error::No such city list: supabase/ops/$CITY_LIST"; exit 1
            fi
            grep -v '^#' "supabase/ops/$CITY_LIST" | grep . >> areas.csv
          fi
          # Whole countries first: they are the big, slow queries, and every
          # city inside one is covered by them anyway.
          if [ -n "$COUNTRIES" ]; then
            echo "$COUNTRIES" | tr ',;' '\n\n' | tr -d ' ' \
              | while read -r cc; do [ -n "$cc" ] && echo "country:$cc"; done >> areas.csv
          fi
          psql "$PGURL" -tAF',' -v ON_ERROR_STOP=1 -c "
            select coalesce(city, ''), coalesce(country_code, ''),
                   round(avg(lat)::numeric, 4), round(avg(lng)::numeric, 4)
              from public.reports
             where status = 'published'
             group by city, country_code
             order by 1;" >> areas.csv
          if [ -n "$EXTRA" ]; then
            echo "$EXTRA" | tr ';' '\n' >> areas.csv
          fi
          echo "Areas to fetch:"
          cat areas.csv
          echo "count: $(grep -c . areas.csv)"

      # This script is the only thing that writes to safety_places, and it runs
      # unattended every night. Checking it against stubs first costs a second
      # and stops a broken generator from reaching the database.
      - name: Check the generator
        run: python3 supabase/ops/fetch_safety_places_test.py

      - name: Fetch from OpenStreetMap
        env:
          # Pruning removes places the filters no longer accept — unnamed
          # nodes, barracks, the second mapping of a station already on the
          # map. It deletes whatever this run did not touch, so it belongs
          # only on a run that covers every area, and the generator refuses it
          # outright if any area was unreachable.
          FLAGS: ${{ inputs.prune && '--prune' || '' }}
        run: |
          python3 supabase/ops/fetch_safety_places.py $FLAGS < areas.csv > safety.sql
          # The script's first line is its own summary: how many places, from
          # how many areas, and which areas it had to skip.
          head -1 safety.sql
          echo "in $(grep -c 'insert into' safety.sql || echo 0) batched statements"

      - name: Load into Supabase
        env:
          PGURL: ${{ env.PGURL_FINAL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f safety.sql
