# ---------------------------------------------------------------------------
# Run a SQL file from this repo against the Supabase database.
#
# Why this exists: Claude Code's web sandbox has no network route to Supabase
# (no IPv6 for the direct host, pooler TCP blocked, HTTPS denied). A GitHub
# runner has all three, so migrations and checks run here instead, and the
# output comes back in the job log.
#
# Setup, once: add a repository secret named SUPABASE_DB_URL
#   Settings -> Secrets and variables -> Actions -> New repository secret
# Use the SESSION POOLER string from Supabase (Connect -> Session pooler):
#   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
# NOT db.<ref>.supabase.co — that host is IPv6-only and GitHub runners are
# IPv4-only, so it fails with "Network is unreachable".
# ---------------------------------------------------------------------------
name: Database

on:
  workflow_dispatch:
    inputs:
      file:
        description: "SQL file under supabase/ to run"
        required: true
        default: "supabase/verify.sql"
        type: string

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  run-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is set
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Secret is present."
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Install psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # psql silently falls back to a local unix socket when the argument is
      # neither a URI nor keyword form, which produces a baffling "no such file
      # or directory". Work out which form this is, and if it is neither, report
      # the value's SHAPE — never its content — so the problem is obvious.
      - name: Check the connection string looks right
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse
          raw = os.environ.get("PGURL", "")
          u = raw.strip().strip('"').strip("'")

          host = port = user = db = None
          pwd = False

          if u.startswith(("postgresql://", "postgres://")):
              p = urllib.parse.urlparse(u)
              host, port, user, pwd = p.hostname, p.port, p.username, bool(p.password)
              db = p.path.lstrip("/") or None
              print("form = connection URI")
          elif "host=" in u and "=" in u:
              kv = dict(part.split("=", 1) for part in u.split() if "=" in part)
              host, user, db = kv.get("host"), kv.get("user"), kv.get("dbname")
              port = kv.get("port"); pwd = "password" in kv
              print("form = keyword string (psql accepts this)")
          else:
              # Describe it without revealing it.
              print("::error::SUPABASE_DB_URL is neither a postgresql:// URI nor a "
                    "host=... keyword string, so psql treats it as a bare database name "
                    "and tries to connect to localhost.")
              print("--- what the value looks like (no content shown) ---")
              print(f"  length              = {len(raw)} characters")
              print(f"  starts with 'psql'  = {u.lower().startswith('psql')}")
              print(f"  contains '://'      = {'://' in u}")
              print(f"  contains '@'        = {'@' in u}")
              print(f"  contains '='        = {'=' in u}")
              print(f"  contains a newline  = {chr(10) in raw or chr(13) in raw}")
              print(f"  has leading/trailing space = {raw != raw.strip()}")
              scheme = u.split('://')[0] if '://' in u else None
              if scheme and len(scheme) < 20:
                  print(f"  scheme found        = {scheme!r}")
              print("---")
              print("Fix: Supabase -> Connect -> Session pooler -> copy the whole URI.")
              print("It must begin with postgresql:// and end with /postgres")
              sys.exit(1)

          print(f"host = {host}")
          print(f"port = {port}")
          print(f"user = {user}")
          print(f"database = {db or '(none)'}")
          print(f"password supplied = {'yes' if pwd else 'NO'}")

          if not pwd:
              print("::error::No password. Replace [YOUR-PASSWORD] with the real database password "
                    "(Supabase -> Settings -> Database), not your Supabase login password.")
              sys.exit(1)
          if not port:
              print("::warning::No port; the pooler needs :5432 (session) or :6543 (transaction).")
          sys.exit(0)
          PY

      # The direct host (db.<ref>.supabase.co) is IPv6-only and GitHub runners
      # are IPv4-only, so it can never work here. Rather than send the user back
      # to the dashboard, derive the pooler equivalent: same project, same
      # password, but user becomes postgres.<ref> and the host is a regional
      # pooler. The region is not in the direct URI, so find it by trying —
      # the wrong region refuses immediately with "Tenant or user not found".
      - name: Resolve a reachable host
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY' > resolved.env
          import os, sys, urllib.parse, subprocess
          u = os.environ["PGURL"].strip().strip('"').strip("'")
          p = urllib.parse.urlparse(u)
          host, pwd = p.hostname or "", p.password or ""

          print(f"::add-mask::{pwd}", file=sys.stderr)

          if "pooler.supabase.com" in host:
              print(f"PGURL_FINAL={u}")
              print(f"Already a pooler host: {host}", file=sys.stderr)
              sys.exit(0)

          if not host.startswith("db.") or not host.endswith(".supabase.co"):
              print(f"PGURL_FINAL={u}")
              print(f"Unrecognised host {host}; trying it as given.", file=sys.stderr)
              sys.exit(0)

          ref = host[len("db."):-len(".supabase.co")]
          print(f"Direct host detected. Finding the pooler for project {ref}...", file=sys.stderr)

          regions = ["eu-central-1","eu-west-1","eu-west-2","eu-west-3","eu-north-1","eu-central-2",
                     "ap-south-1","ap-southeast-1","ap-southeast-2","ap-northeast-1","ap-northeast-2",
                     "us-east-1","us-east-2","us-west-1","us-west-2","ca-central-1","sa-east-1"]
          quoted = urllib.parse.quote(pwd, safe="")
          env = {**os.environ, "PGCONNECT_TIMEOUT": "6"}

          for prefix in ("aws-0", "aws-1"):
              for r in regions:
                  ph = f"{prefix}-{r}.pooler.supabase.com"
                  cand = f"postgresql://postgres.{ref}:{quoted}@{ph}:5432/postgres"
                  res = subprocess.run(["psql", cand, "-tAc", "select 1"],
                                       capture_output=True, text=True, env=env)
                  if res.returncode == 0:
                      print(f"Connected via {ph}", file=sys.stderr)
                      print(f"PGURL_FINAL={cand}")
                      sys.exit(0)
                  err = (res.stderr or "").strip().splitlines()
                  if err and "Tenant or user not found" not in err[-1]:
                      print(f"  {ph}: {err[-1][:110]}", file=sys.stderr)

          print("::error::Could not reach any pooler host for this project. Copy the Session "
                "pooler URI from Supabase -> Connect and set it as SUPABASE_DB_URL.", file=sys.stderr)
          sys.exit(1)
          PY
          cat resolved.env >> "$GITHUB_ENV"
          rm -f resolved.env

      - name: Prove the connection
        env:
          PGURL: ${{ env.PGURL_FINAL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c \
            "select current_database() as database, current_user as connected_as, version();"

      # The path comes in via env, never interpolated into the script, and must
      # live under supabase/ — so only SQL committed to this repo can run.
      - name: Run the SQL file
        env:
          PGURL: ${{ env.PGURL_FINAL }}
          SQL_FILE: ${{ inputs.file }}
        run: |
          case "$SQL_FILE" in
            supabase/*.sql) ;;
            *) echo "::error::Only .sql files under supabase/ may be run. Got: $SQL_FILE"; exit 1 ;;
          esac
          if [ ! -f "$SQL_FILE" ]; then
            echo "::error::No such file in this repo: $SQL_FILE"; exit 1
          fi
          echo "----- running $SQL_FILE -----"
          psql "$PGURL" -v ON_ERROR_STOP=1 -f "$SQL_FILE"
          echo "----- done -----"
