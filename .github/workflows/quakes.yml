# ---------------------------------------------------------------------------
# Earthquakes, from USGS, into public.quake_events.
#
# The page used to read the USGS feeds itself: they carry permissive CORS and a
# 60-second cache and are built to be read from a browser, so it worked. It
# left earthquakes as the one hazard with a different shape from every other,
# and the only one where a reader's browser talked to an outside service. One
# table and one job for all of them is worth more than the freshness it costs.
#
# Twice a day. An earthquake can therefore be up to twelve hours old on the map
# before this runs again — said plainly because it is the cost of the above.
# This is a trip-planning signal, not an alerting service; the official USGS
# page is linked on every quake and the emergency numbers are already on the
# map. To make it tighter, change the cron below and nothing else.
#
# Separate from the hazards workflow on purpose: that one runs every three
# hours for GDACS and MeteoAlarm, and a shared schedule would mean choosing
# one cadence for four sources with different rhythms.
#
# Needs the same SUPABASE_DB_URL secret as the other database workflows.
# ---------------------------------------------------------------------------
name: Refresh earthquakes

on:
  workflow_dispatch:
  schedule:
    # Twice a day, off the hour: a schedule on the hour is where every other
    # repository's is, and GitHub runs those late.
    - cron: '7 1,13 * * *'

concurrency:
  group: quakes
  cancel-in-progress: false

jobs:
  quakes:
    runs-on: ubuntu-latest
    # A source that stops answering must not hold a runner for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL is not set."
            exit 1
          fi

      - name: Install psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      - name: Resolve a reachable host
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY' > resolved.env
          import os, sys, urllib.parse, subprocess
          u = os.environ["PGURL"].strip().strip('"').strip("'")
          p = urllib.parse.urlparse(u)
          host, pwd = p.hostname or "", p.password or ""
          print(f"::add-mask::{pwd}", file=sys.stderr)

          if "pooler.supabase.com" in host or not host.startswith("db."):
              print(f"PGURL_FINAL={u}")
              sys.exit(0)

          ref = host[len("db."):-len(".supabase.co")]
          regions = ["eu-central-1","eu-west-1","eu-west-2","eu-west-3","eu-north-1","eu-central-2",
                     "ap-south-1","ap-southeast-1","ap-southeast-2","ap-northeast-1","ap-northeast-2",
                     "us-east-1","us-east-2","us-west-1","us-west-2","ca-central-1","sa-east-1"]
          quoted = urllib.parse.quote(pwd, safe="")
          env = {**os.environ, "PGCONNECT_TIMEOUT": "6"}
          for prefix in ("aws-0", "aws-1"):
              for r in regions:
                  ph = f"{prefix}-{r}.pooler.supabase.com"
                  cand = f"postgresql://postgres.{ref}:{quoted}@{ph}:5432/postgres"
                  if subprocess.run(["psql", cand, "-tAc", "select 1"],
                                    capture_output=True, text=True, env=env).returncode == 0:
                      print(f"Connected via {ph}", file=sys.stderr)
                      print(f"PGURL_FINAL={cand}")
                      sys.exit(0)
          print("::error::Could not reach any pooler host.", file=sys.stderr)
          sys.exit(1)
          PY
          cat resolved.env >> "$GITHUB_ENV"
          rm -f resolved.env

      # The only thing that writes to quake_events, running unattended. The
      # case worth guarding is USGS answering badly, which taken literally
      # means the Earth has gone quiet.
      - name: Check the generator
        run: python3 supabase/ops/fetch_quakes_test.py

      - name: Fetch from USGS
        run: |
          python3 supabase/ops/fetch_quakes.py > quakes.sql
          head -1 quakes.sql

      - name: Load the earthquakes into Supabase
        env:
          PGURL: ${{ env.PGURL_FINAL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f quakes.sql
